<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoSpeak</title>
    <link rel="stylesheet" href="dialogue-audio.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1 {
            margin-bottom: 0;
        }

        .subtitle {
            margin-top: 5px;
            color: #666;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #generateButton {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        #scenario {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            font: inherit;
        }

        #loading {
            margin-top: 20px;
        }

        #error {
            margin-top: 20px;
            color: #c00;
        }

        #result {
            margin-top: 40px;
        }

        .target-phrase {
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .dialogue-line {
            margin: 12px 0;
        }

        .speaker {
            font-weight: bold;
            margin-right: 8px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<h1>EcoSpeak</h1>
<p class="subtitle">Practice natural English in 3 minutes.</p>

<label for="scenario">Scenario</label>
<input id="scenario" type="text" placeholder="Ordering coffee"
       aria-describedby="error">

<div id="quotaStatus" role="status">Loading generation allowance...</div>
<button id="quotaRetry" class="hidden" type="button" onclick="refreshQuota()">Retry allowance</button>
<button id="recoverButton" class="hidden" type="button" onclick="recoverPending()">Recover pending result</button>
<button id="generateButton" onclick="generateDialogue()" disabled>
    Generate Dialogue
</button>

<button id="historyButton" onclick="location.href='history.html'">History</button>

<div id="loading" class="hidden">
    Generating...
</div>

<div id="error" class="hidden" role="alert">
    Something went wrong. Please try again.
</div>

<div id="result" class="hidden">

    <h2 id="topic"></h2>

    <div class="target-phrase">
        <strong>Target Phrase</strong>
        <div id="targetPhrase"></div>
    </div>

    <div class="audio-controls" aria-label="Dialogue audio">
        <button id="audioPlay" type="button" disabled>Play</button>
        <button id="audioRetry" type="button" hidden>Retry audio</button>
        <span class="audio-disclosure">AI-generated voices</span>
        <p id="audioStatus" class="audio-status" role="status" aria-live="polite"></p>
    </div>
    <div id="dialogue"></div>

</div>

<script src="dialogue-audio.js"></script>
<script>
    let quota = null, busy = false, resetTimer;
    const pendingKey = 'ecospeak.pendingGeneration';
    function pending() { try { return JSON.parse(sessionStorage.getItem(pendingKey)); } catch (_) { return null; } }
    function showPending() { document.getElementById('recoverButton').classList.toggle('hidden', !pending()); }
    function updateButton() { document.getElementById('generateButton').disabled = busy || !quota || !quota.daily.remaining || !quota.weekly.remaining; document.getElementById('recoverButton').disabled = busy; }
    function displayQuota(value) {
        quota = value;
        const reservation = value.daily.reserved || value.weekly.reserved ? ` Reservations: ${value.daily.reserved} today, ${value.weekly.reserved} this week.` : '';
        const reset = value.nextAvailableAt ? ` Available again ${new Date(value.nextAvailableAt).toLocaleString(undefined, {timeZone: value.timezone})} (${value.timezone}).` : '';
        document.getElementById('quotaStatus').textContent = `Today: ${value.daily.used} of ${value.daily.limit} used. This week: ${value.weekly.used} of ${value.weekly.limit} used.${reservation}${reset}`;
        document.getElementById('quotaRetry').classList.add('hidden');
        clearTimeout(resetTimer);
        if (value.nextAvailableAt) resetTimer = setTimeout(refreshQuota, Math.min(2147483647, Math.max(1000, new Date(value.nextAvailableAt) - Date.now() + 100)));
        updateButton();
    }
    async function refreshQuota() {
        try { const response = await fetch('/api/dialogs/quota', {cache:'no-store'}); if (!response.ok) throw new Error('Quota unavailable'); displayQuota(await response.json()); }
        catch (e) { quota = null; document.getElementById('quotaStatus').textContent = 'Could not load generation allowance.'; document.getElementById('quotaRetry').classList.remove('hidden'); updateButton(); }
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshQuota(); });
    document.getElementById('scenario').addEventListener('input', () => { const p = pending(); if (p && p.scenario !== document.getElementById('scenario').value.trim()) { sessionStorage.removeItem(pendingKey); showPending(); } });
    async function recoverPending() { const p = pending(); if (p) { document.getElementById('scenario').value = p.scenario; await generateDialogue(p); } }
    showPending(); refreshQuota();
    async function generateDialogue(recovery = null) {

        const button = document.getElementById('generateButton');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');

        if (busy || (!recovery && button.disabled)) {
            return;
        }

        const scenarioInput = document.getElementById('scenario');
        const scenario = scenarioInput.value.trim();

        if (!scenario) {
            error.textContent = 'Please enter a scenario.';
            error.classList.remove('hidden');
            scenarioInput.setAttribute('aria-invalid', 'true');
            scenarioInput.focus();
            return;
        }

        busy = true; updateButton();
        loading.classList.remove('hidden');
        error.classList.add('hidden');
        scenarioInput.removeAttribute('aria-invalid');

        const request = recovery || { key: crypto.randomUUID(), scenario };
        sessionStorage.setItem(pendingKey, JSON.stringify(request)); showPending();

        try {

            const response = await fetch('/api/dialogs/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Idempotency-Key': request.key },
                body: JSON.stringify({ scenario })
            });

            if (response.status === 409) {
                const payload = await response.json();
                if (payload.code === 'generation_in_progress') {
                    loading.textContent = 'Generation is still in progress...';
                    await new Promise(resolve => setTimeout(resolve, Math.max(1, Number(response.headers.get('Retry-After')) || 1) * 1000));
                    busy = false; return await generateDialogue(request);
                }
            }
            if (response.status === 429) {
                const payload = await response.json(); displayQuota(payload.quota);
                sessionStorage.removeItem(pendingKey); showPending();
                error.textContent = 'Generation allowance exhausted. See reset time above.'; error.classList.remove('hidden');
                return;
            }
            if (!response.ok) {
                sessionStorage.removeItem(pendingKey); showPending();
                throw new Error('Failed to generate dialogue');
            }

            const data = await response.json();

            const isObject = value =>
                value !== null && typeof value === 'object' && !Array.isArray(value);
            const isNonblankString = value =>
                typeof value === 'string' && value.trim().length > 0;

            if (!isObject(data)
                    || !isNonblankString(data.topic)
                    || !isNonblankString(data.targetPhrase)
                    || !Array.isArray(data.dialogue)
                    || data.dialogue.length === 0
                    || !data.dialogue.every(line => isObject(line)
                        && isNonblankString(line.speaker)
                        && isNonblankString(line.text))) {
                throw new Error('Invalid dialogue response');
            }

            document.getElementById('topic').textContent = data.topic;
            document.getElementById('targetPhrase').textContent =
                data.targetPhrase;

            const dialogueElement =
                document.getElementById('dialogue');

            dialogueElement.innerHTML = '';

            data.dialogue.forEach(line => {

                const lineElement = document.createElement('div');
                lineElement.className = 'dialogue-line';

                const speakerElement = document.createElement('span');
                speakerElement.className = 'speaker';
                speakerElement.textContent = line.speaker + ':';

                const textElement = document.createElement('span');
                textElement.textContent = line.text;

                lineElement.appendChild(speakerElement);
                lineElement.appendChild(textElement);

                dialogueElement.appendChild(lineElement);
            });

            result.classList.remove('hidden');

            button.textContent = 'Generate Another';
            sessionStorage.removeItem(pendingKey); showPending();
            window.dialogueAudio.set(data.historySaved === true ? data.historyId : null, true);

        } catch (e) {

            console.error(e);

            error.textContent = 'Something went wrong. Please try again.';
            error.classList.remove('hidden');

        } finally {

            loading.classList.add('hidden');
            loading.textContent = 'Generating...'; busy = false; updateButton();
            await refreshQuota();
        }
    }
</script>

</body>
</html>
